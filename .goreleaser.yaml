version: 2

project_name: git-sync

builds:
  - id: git-sync
    main: ./cmd/git-sync
    binary: git-sync
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

# binários soltos, sem compactar (git-sync_linux_amd64, git-sync_windows_amd64.exe…).
# O nome não leva a versão: assim o link .../releases/latest/download/<nome>
# não muda, e o `git-sync update` sabe qual arquivo baixar (update.AssetName).
archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

# o `git-sync update` confere o download por este arquivo
checksum:
  name_template: checksums.txt

# as notas da release vêm do CHANGELOG.md gerado pelo commitizen
changelog:
  disable: true
